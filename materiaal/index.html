<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesdag AISO26009</title>
<meta name="description" content="Startpagina voor de beamer tijdens een lesdag van AISO26009 AI Strategie en Organisatietransformatie: programma, tijdlijn en materiaal per blok.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a1a1a'%3E%3Cpolygon points='9,29 11,10 17,10 19,29'/%3E%3Cpolygon points='8,8.5 20,8.5 19,10 9,10'/%3E%3Crect x='11' y='5' width='6' height='3.5'/%3E%3Cpath d='M10.5 5 Q10.5 1.5 14 1.5 Q17.5 1.5 17.5 5 Z'/%3E%3Crect x='13.5' y='0' width='1' height='1.8'/%3E%3C/g%3E%3Crect x='13' y='6' width='2' height='2' fill='%23d4db3e'/%3E%3Cg stroke='%23d4db3e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M21 4 L26 7 L21 10'/%3E%3Cpath d='M26 4 L31 7 L26 10'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ================================================================
   Business Data Solutions: tokens overgenomen uit
   brand-project/stylebook/shared.css (v1, 2026-05-19). Alleen licht.
   ================================================================ */
:root {
  --primary: #d4db3e;
  --supporting: #1a1a1a;
  --cream: #f5f0e6;
  --bg-yellow: #fafbf0;
  --bg-cream: #f5f0e6;
  --bg-cream-2: #f0ebe0;
  --bg-off-white: #f9f8f4;
  --text-primary: #111827;
  --text-secondary: #4b5563;
  --text-muted: #6b7280;
  --bg-page: #ffffff;
  --bg-section: #f9fafb;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --shadow-md: 0 2px 4px rgba(0,0,0,.06), 0 8px 16px rgba(0,0,0,.06);
  --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-full: 9999px;

  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace;
  --rand: clamp(16px, 4vw, 56px);
  --breed: 1680px;
  --band: 0px; /* hoogte van de vaste tijdlijn, gezet door het script */
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--band) + 16px); }
body {
  font-family: var(--sans); font-size: 1rem; line-height: 1.5;
  color: var(--text-primary); background: var(--bg-off-white);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  min-height: 100vh; display: flex; flex-direction: column;
}
a { color: var(--text-primary); text-decoration: underline; text-decoration-color: var(--primary); text-decoration-thickness: 2px; text-underline-offset: 3px; }
button { font: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------------- Kop: warm zwart, rolt mee met de pagina ---------------- */
header.kop { background: var(--supporting); color: var(--bg-off-white); }
.kop-binnen { max-width: var(--breed); margin: 0 auto; padding: clamp(14px, 1.8vw, 28px) var(--rand) clamp(18px, 2vw, 32px); display: flex; flex-direction: column; gap: clamp(12px, 1.4vw, 22px); }
.kop-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 32px; }
.titel { min-width: 0; }
.eyebrow { font-size: clamp(.75rem, .8vw, .9rem); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); font-weight: 600; margin: 0 0 6px; }
h1 { font-size: clamp(1.25rem, 2vw, 2.125rem); font-weight: 700; line-height: 1.15; margin: 0; overflow-wrap: break-word; text-wrap: balance; }

.pillen { display: flex; flex-wrap: wrap; gap: 6px; }
.pil { font-size: .875rem; font-weight: 600; border: 1px solid var(--text-secondary); background: none; color: var(--border); border-radius: var(--radius-full); padding: 6px 14px; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.3; }
.pil:hover { border-color: var(--primary); }
.pil[aria-current="page"] { background: var(--primary); border-color: var(--primary); color: var(--supporting); }
.kop :focus-visible { outline: 2px solid var(--bg-off-white); outline-offset: 2px; }

.nu { min-width: 0; display: grid; gap: clamp(16px, 2vw, 32px); align-items: start; }
.nu-hoofd { min-width: 0; display: flex; flex-direction: column; }
/* De vragen van het blok staan voluit naast het blok: wie de kaart kwijt is of achterin zit, leest ze hier (ADR-046) */
@media (min-width: 1100px) { .nu.met-vragen { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.nu-vragen { min-width: 0; border: 1px solid var(--text-secondary); border-radius: var(--radius-md); padding: clamp(12px, 1.2vw, 20px) clamp(14px, 1.4vw, 24px); }
.nu-vragen-kop { font-size: clamp(.75rem, .9vw, 1rem); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); font-weight: 700; margin: 0 0 10px; }
.nu-vragen ol { list-style: none; margin: 0; padding: 0; display: grid; gap: clamp(8px, .8vw, 14px); }
.nu-vragen li { font-size: clamp(.95rem, 1.05vw, 1.25rem); line-height: 1.35; color: var(--border); }
.nv-kop { display: block; font-weight: 700; color: var(--bg-off-white); }
.nv-kop b { font-family: var(--mono); color: var(--primary); margin-right: 8px; }
.nu-vragen-waar { margin: 12px 0 0; font-size: clamp(.8rem, .9vw, 1rem); color: var(--border-strong); }
.nu-vragen-waar b { color: var(--bg-off-white); }
.nu-tegels { margin-top: 16px; }
.nu-label { font-size: clamp(.75rem, .9vw, 1rem); letter-spacing: .1em; text-transform: uppercase; color: var(--primary); font-weight: 700; margin: 0; min-height: 1.4em; }
.nu-titel { font-size: clamp(1.5rem, 2.9vw, 3.25rem); font-weight: 700; line-height: 1.1; margin: 6px 0 0; text-wrap: balance; overflow-wrap: break-word; }
.nu-maakt { font-size: clamp(1rem, 1.35vw, 1.5rem); color: var(--border); margin: 12px 0 0; max-width: 60ch; }
.nu-maakt b { color: var(--bg-off-white); }
.nu-daarna { font-size: clamp(.875rem, 1.05vw, 1.2rem); color: var(--border-strong); margin: 8px 0 0; }

/* ---------------- Werkkaart: zeven vaste vragen per blok (ADR-047) ----------------
   Drie kolommen in de volgorde waarin de deelnemer ze nodig heeft: voor je begint,
   wat je doet, en of je goed zit. In de kop donker, in de lijst licht. */
.nu-werk, .nu-trainer { grid-column: 1 / -1; min-width: 0; }
/* Op een smal scherm staat alles onder elkaar: eerst wat je doet, dan de vragen voluit
   (die staan ook als chips in de band). */
@media (max-width: 1099px) { .nu-vragen { order: 1; } }
.werkkaart { display: grid; gap: clamp(10px, 1vw, 18px); }
@media (min-width: 900px) { .werkkaart { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.wk-groep { margin: 0; display: grid; align-content: start; gap: clamp(8px, .8vw, 14px); border-radius: var(--radius-md); padding: clamp(12px, 1.1vw, 18px) clamp(14px, 1.3vw, 22px); }
.wk-groep dt { font-size: clamp(.7rem, .75vw, .9rem); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; margin: 0 0 2px; }
.wk-groep dd { margin: 0; font-size: clamp(.9rem, .95vw, 1.15rem); line-height: 1.4; }
.wk-groep dd p { margin: 0; }
.wk-groep dd p + p { margin-top: 4px; }
.wk-groep ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.nu-werk .wk-groep { border: 1px solid var(--text-secondary); color: var(--border); }
.nu-werk .wk-groep dt { color: var(--primary); }
.nu-werk .wk-groep.is-doen { border-color: var(--primary); color: var(--bg-off-white); }
.nu-werk .wk-uit { color: var(--border-strong); }
.werk .wk-groep { background: var(--bg-page); border: 1px solid var(--border); color: var(--text-secondary); }
.werk .wk-groep dt { color: var(--text-primary); }
.werk .wk-groep.is-doen { border-color: var(--supporting); color: var(--text-primary); }
.werk .wk-uit { color: var(--text-muted); }
.werk { margin-top: 12px; }
.werk > summary, .trainer > summary { cursor: pointer; font-size: .875rem; font-weight: 700; color: var(--text-secondary); width: fit-content; }
.werk > summary:focus-visible, .trainer > summary:focus-visible { outline: 2px solid var(--supporting); outline-offset: 2px; }
.werk[open] > summary { margin-bottom: 10px; }

/* ---------------- Weergave met ?rol=trainer (ADR-047) ----------------
   Zonder de parameter maakt het script deze blokken niet aan: ze staan dan ook niet
   verborgen in de pagina. */
.rol-band { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-size: clamp(.8rem, .9vw, 1rem); color: var(--supporting); background: var(--primary); border-radius: var(--radius-sm); padding: 8px 14px; }
.rol-band a { color: var(--supporting); text-decoration-color: var(--supporting); font-weight: 700; }
.trainer { border: 2px dashed var(--primary); border-radius: var(--radius-md); padding: clamp(12px, 1.1vw, 18px) clamp(14px, 1.3vw, 22px); }
.tr-kop { margin: 0 0 8px; font-size: clamp(.7rem, .8vw, .95rem); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--primary); }
.trainer dl { margin: 0; display: grid; gap: 8px 20px; }
@media (min-width: 900px) { .trainer dl { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr); } }
.trainer dt { font-weight: 700; font-size: .85rem; margin-bottom: 2px; }
.trainer dd { margin: 0; font-size: clamp(.9rem, .95vw, 1.1rem); line-height: 1.4; }
.trainer ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.trainer li { padding: 2px 6px; border-radius: 4px; }
.tr-tijd { font-family: var(--mono); font-variant-numeric: tabular-nums; margin-right: 4px; }
.nu-trainer { color: var(--border); }
.nu-trainer dt { color: var(--bg-off-white); }
.nu-trainer li.is-nu { background: var(--primary); color: var(--supporting); }
.rij .trainer { margin-top: 12px; background: var(--bg-page); color: var(--text-secondary); border-color: var(--supporting); }
.rij .trainer .tr-kop { color: var(--supporting); }
.rij .trainer dt { color: var(--text-primary); }

/* ---------------- Tijdlijn: lichte band die blijft staan ----------------
   De band is een broer van de kop, geen kind: alleen dan blijft hij plakken
   als de kop uit beeld rolt. De schaduw bij "vast" is een extra (Chrome, Edge). */
.band { position: sticky; top: 0; z-index: 10; container: band / scroll-state; }
.band-vlak { background: var(--bg-page); color: var(--text-primary); border-bottom: 1px solid var(--border); transition: box-shadow .2s; }
@container band scroll-state(stuck: top) {
  .band-vlak { box-shadow: 0 6px 16px rgba(0,0,0,.08); }
}
.band-binnen { max-width: var(--breed); margin: 0 auto; padding: 14px var(--rand) 8px; }
/* De vier vragen (NFR-09): altijd in beeld, de vragen van het blok van nu lichten op */
.vragen { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 10px; padding: 0; list-style: none; }
.vraag-chip { display: inline-flex; align-items: baseline; gap: 6px; font-size: clamp(.8rem, .95vw, 1.05rem); border: 1px solid var(--border-strong); border-radius: var(--radius-full); padding: 3px 12px; color: var(--text-muted); background: var(--bg-page); transition: background .2s, color .2s, border-color .2s; }
.vraag-chip b { font-family: var(--mono); color: var(--text-secondary); }
.vraag-chip.is-actief { background: var(--primary); border-color: var(--supporting); color: var(--supporting); font-weight: 700; }
.vraag-chip.is-actief b { color: var(--supporting); }
.spoor { position: relative; height: clamp(16px, 2vw, 30px); }
.balk { position: absolute; top: 0; bottom: 0; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--bg-page); color: var(--text-primary); cursor: pointer; container-type: inline-size; overflow: hidden; transition: opacity .3s; }
.balk span { display: block; padding: 0 8px; font-size: .75rem; font-weight: 600; line-height: calc(clamp(16px, 2vw, 30px) - 2px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@container (max-width: 84px) { .balk span { display: none; } }
.balk:hover { box-shadow: var(--shadow-md); }
.balk.is-later { opacity: .5; }
.balk.is-nu { outline: 2px solid var(--supporting); outline-offset: 1px; z-index: 1; }
.t-werkplaats { background: var(--primary); border-color: var(--primary); color: var(--supporting); }
.t-deck { background: var(--bg-cream-2); color: var(--supporting); }
.t-inhoud { background: var(--bg-page); }
.t-samen { background: var(--supporting); border-color: var(--supporting); color: #fff; }
.t-pauze { background: repeating-linear-gradient(135deg, var(--bg-section) 0 6px, var(--bg-page) 6px 12px); border-style: dashed; color: var(--text-muted); }
.balk.t-pauze span { font-weight: 400; }
.pin { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--supporting); box-shadow: 0 0 0 2px var(--bg-page); z-index: 2; pointer-events: none; }
.pin::before { content: ""; position: absolute; left: 50%; top: -6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--primary); border: 2px solid var(--supporting); }
.ticks { position: relative; height: 18px; margin-top: 6px; font-family: var(--mono); font-size: .7rem; color: var(--text-muted); }
.tick { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.tick.is-begin { transform: none; }
.tick.is-eind { transform: translateX(-100%); }
/* Werkregel 1 vóór en tijdens een pauze (FR-28), in de band zodat hij ook na scrollen in beeld blijft */
.regel { font-size: clamp(.95rem, 1.1vw, 1.3rem); margin: 10px 0 6px; padding: 8px 16px; border-left: 4px solid var(--primary); background: var(--bg-yellow); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }

/* ---------------- Blokken ---------------- */
main { flex: 1 0 auto; width: 100%; max-width: var(--breed); margin: 0 auto; padding: clamp(16px, 2.4vw, 36px) var(--rand) clamp(32px, 4vw, 56px); }
.lijst { list-style: none; margin: 0; padding: 0; }
.rij { display: grid; grid-template-columns: clamp(7.5rem, 10vw, 11rem) minmax(0, 1fr); gap: 6px clamp(16px, 2vw, 32px); padding: clamp(16px, 1.6vw, 24px) 16px; border-top: 1px solid var(--border); border-radius: var(--radius-md); }
.rij:first-child { border-top-color: transparent; }
.rij.is-nu { background: var(--bg-yellow); box-shadow: inset 4px 0 0 var(--primary), 0 0 0 1px var(--primary); border-top-color: transparent; }
.rij.is-nu + .rij { border-top-color: transparent; }
.rij-tijd { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.van-tot { font-size: clamp(.95rem, 1.1vw, 1.25rem); font-weight: 600; color: var(--text-primary); white-space: nowrap; }
.duur { font-size: .8rem; color: var(--text-muted); }
.rij-inhoud { min-width: 0; }
.rij-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 4px; }
.type { display: inline-flex; align-items: center; gap: 8px; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--text-secondary); }
.staal { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border-strong); flex-shrink: 0; }
.nu-badge { display: none; font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--primary); color: var(--supporting); border-radius: var(--radius-full); padding: 2px 10px; }
.rij.is-nu .nu-badge { display: inline-block; }
.rij-titel { font-size: clamp(1.125rem, 1.55vw, 1.75rem); font-weight: 700; line-height: 1.25; margin: 0; overflow-wrap: break-word; }
.tegel:focus-visible, footer a:focus-visible { outline: 2px solid var(--supporting); outline-offset: 2px; }
.maakt { margin: 8px 0 0; font-size: clamp(1rem, 1.15vw, 1.25rem); color: var(--text-secondary); max-width: 75ch; }
.maakt b { color: var(--text-primary); }
.tegels { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; margin-top: 14px; }
.tegel { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bg-page); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; text-decoration: none; font-weight: 700; line-height: 1.3; transition: transform .15s, border-color .15s; }
.tegel:hover { border-color: var(--primary); transform: translateY(-2px); }
.tegel-pijl { flex-shrink: 0; width: 30px; height: 30px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; font-size: .95rem; font-weight: 700; background: var(--bg-cream); color: var(--supporting); }
.tegel.is-extern .tegel-pijl { background: var(--primary); color: var(--supporting); }

.rij.is-pauze { padding-top: 8px; padding-bottom: 8px; align-items: center; color: var(--text-muted); }
.rij.is-pauze .van-tot { font-size: .875rem; font-weight: 400; color: var(--text-muted); }
.rij.is-pauze .rij-inhoud { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.pauze-titel { font-size: .95rem; color: var(--text-muted); }
.rij.is-pauze.is-nu .pauze-titel { color: var(--text-primary); font-weight: 600; }
.pauze-ai { flex: 1 1 28ch; min-width: 0; font-size: clamp(.875rem, .95vw, 1.05rem); color: var(--text-muted); }
.pauze-ai b { color: var(--text-secondary); font-weight: 600; }
.pauze-link { font-weight: 600; }

.melding-kaart { background: var(--bg-page); border: 1px dashed var(--supporting); border-radius: var(--radius-md); padding: clamp(20px, 2.4vw, 32px); max-width: 70ch; }
.melding-kaart h2 { font-size: clamp(1.25rem, 1.8vw, 1.75rem); margin: 0 0 12px; line-height: 1.25; }
.melding-kaart p, .melding-kaart li { margin: 0 0 10px; }
.melding-kaart ol { padding-left: 1.25rem; margin: 0 0 10px; }
.melding-kaart code { font-family: var(--mono); font-size: .9em; background: var(--bg-section); padding: .1em .4em; border-radius: 4px; border: 1px solid var(--border); overflow-wrap: anywhere; }
.melding-kaart .fout { font-size: .875rem; color: var(--text-muted); }
.laden { color: var(--text-muted); }

/* ---------------- Voet ---------------- */
footer { width: 100%; max-width: var(--breed); margin: 0 auto; padding: 16px var(--rand) 28px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; font-size: .8rem; color: var(--text-muted); }
footer .voet-links { display: flex; flex-wrap: wrap; gap: 8px 20px; }
footer .binnen { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; border-top: 1px solid var(--border); padding-top: 16px; }
.merk { display: inline-flex; align-items: center; gap: 8px; color: var(--supporting); font-weight: 700; white-space: nowrap; }
.merk svg { width: 22px; height: 22px; flex-shrink: 0; }

/* ---------------- Smal scherm: alles onder elkaar ---------------- */
@media (max-width: 720px) {
  .rij { grid-template-columns: minmax(0, 1fr); padding-left: 12px; padding-right: 12px; }
  .rij-tijd { flex-direction: row; align-items: baseline; gap: 10px; }
  .rij.is-pauze { grid-template-columns: auto minmax(0, 1fr); }
  .tick.is-dicht { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .tegel:hover { transform: none; }
}
</style>
</head>
<body>
<header class="kop" id="kop">
  <div class="kop-binnen">
    <div class="kop-top">
      <div class="titel">
        <p class="eyebrow">AISO26009 · AI Strategie en Organisatietransformatie</p>
        <h1 id="dagtitel">Lesdag</h1>
      </div>
      <nav class="pillen" id="dagen" aria-label="Lesdag"></nav>
    </div>
    <div class="nu" id="nu" hidden>
      <div class="nu-hoofd">
        <p class="nu-label" id="nu-label"></p>
        <p class="nu-titel" id="nu-titel"></p>
        <p class="nu-maakt" id="nu-maakt" hidden></p>
        <div class="tegels nu-tegels" id="nu-tegels" hidden></div>
        <p class="nu-daarna" id="nu-daarna" hidden></p>
      </div>
      <section class="nu-vragen" id="nu-vragen" aria-labelledby="nu-vragen-kop" hidden>
        <h2 class="nu-vragen-kop" id="nu-vragen-kop"></h2>
        <ol id="nu-vragen-lijst"></ol>
        <p class="nu-vragen-waar">De vier vragen staan ook op je <b>geprinte vragenkaart</b>, dia 1 van het casusdeck. Daar schrijf je je antwoorden.</p>
      </section>
      <section class="nu-werk" id="nu-werk" aria-label="Zo werk je in dit blok" hidden></section>
    </div>
  </div>
</header>
<div class="band" id="band" hidden>
  <div class="band-vlak">
    <div class="band-binnen">
      <ul class="vragen" id="vragen" aria-label="De vier vragen" hidden></ul>
      <div class="spoor" id="spoor" aria-hidden="true"></div>
      <div class="ticks" id="ticks" aria-hidden="true"></div>
      <p class="regel" id="regel" hidden></p>
    </div>
  </div>
</div>
<div class="sr" id="melding" aria-live="polite"></div>

<main id="inhoud">
  <p class="laden" id="laden">Programma laden…</p>
  <ol class="lijst" id="lijst" aria-label="Programma van de dag" hidden></ol>
</main>

<footer>
  <div class="binnen">
    <span class="merk">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="#1a1a1a"><polygon points="9,29 11,10 17,10 19,29"/><polygon points="8,8.5 20,8.5 19,10 9,10"/><rect x="11" y="5" width="6" height="3.5"/><path d="M10.5 5 Q10.5 1.5 14 1.5 Q17.5 1.5 17.5 5 Z"/><rect x="13.5" y="0" width="1" height="1.8"/></g><rect x="13" y="6" width="2" height="2" fill="#d4db3e"/><g stroke="#d4db3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M21 4 L26 7 L21 10"/><path d="M26 4 L31 7 L26 10"/></g></svg>
      Business Data Solutions
    </span>
  </div>
</footer>

<script type="module">
/* ================================================================
   Het programma staat alleen in de LRD (const DATA). Deze pagina
   haalt de LRD op, knipt het DATA-object eruit en leest het.
   ================================================================ */
const LRD_URL = new URL('../LRD-AISO26009-lesdagen.html', location.href);
const TZ = 'Europe/Amsterdam';
const VIJF_MIN = 300;
const TYPES = ['inhoud', 'werkplaats', 'deck', 'samen', 'pauze'];
const RUSTIG = matchMedia('(prefers-reduced-motion: reduce)');
const params = new URLSearchParams(location.search);
// De trainer opent de pagina met ?rol=trainer. Zonder die parameter maakt het script niets
// voor de trainer aan: geen instructie, geen draaiboek, geen ontwerp (ADR-047).
const TRAINER = params.get('rol') === 'trainer';
const DRAAIBOEK = 'https://github.com/businessdatasolutions/aiso/blob/main/materiaal/draaiboek-bouwstenen.md';

const $ = id => document.getElementById(id);
const kop = $('kop'), band = $('band');
/* Hoogte van de vaste tijdlijn, zodat een blok niet onder de band verdwijnt. */
function meetBand() {
  document.documentElement.style.setProperty('--band', `${band.offsetHeight}px`);
}
const naarBlok = i => $(`blok-${i}`)?.scrollIntoView({ block: 'start', behavior: RUSTIG.matches ? 'instant' : 'smooth' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Tijd in Amsterdam ---------- */
const delen = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
const datumNL = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
function echteSec() {
  const p = Object.fromEntries(delen.formatToParts(new Date()).map(x => [x.type, x.value]));
  return (+p.hour % 24) * 3600 + (+p.minute) * 60 + (+p.second) + (Date.now() % 1000) / 1000;
}
// ?tijd=10:42 zet de klok op een andere tijd van de dag, om de pagina te proberen.
let verschuiving = 0;
const proef = /^(\d{1,2}):(\d{2})$/.exec(params.get('tijd') || '');
if (proef) verschuiving = (+proef[1] * 3600 + +proef[2] * 60) - echteSec();
const nuSec = () => ((echteSec() + verschuiving) % 86400 + 86400) % 86400;
const hm = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s).trim()); return m ? +m[1] * 3600 + +m[2] * 60 : NaN; };
const klokTekst = sec => { const m = Math.floor(sec / 60); return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; };

/* ---------- DATA uit de LRD ---------- */
function objectLiteraal(src, merk) {
  const op = src.indexOf(merk);
  if (op < 0) throw new Error(`"${merk}" staat niet in de LRD`);
  const begin = op + merk.length - 1;
  let diepte = 0;
  for (let i = begin; i < src.length; i++) {
    const c = src[i], n = src[i + 1];
    if (c === "'" || c === '"' || c === '`') {
      for (i++; i < src.length && src[i] !== c; i++) if (src[i] === '\\') i++;
    } else if (c === '/' && n === '/') {
      i = src.indexOf('\n', i); if (i < 0) break;
    } else if (c === '/' && n === '*') {
      i = src.indexOf('*/', i + 2); if (i < 0) break; i++;
    } else if (c === '{') diepte++;
    else if (c === '}' && --diepte === 0) return src.slice(begin, i + 1);
  }
  throw new Error('het DATA-object in de LRD sluit niet');
}
function leesData(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const script = doc.querySelector('script[type="module"]');
  if (!script) throw new Error('geen module-script in de LRD');
  // De LRD is een eigen bestand uit dezelfde repo, opgehaald van een vast pad op dezelfde
  // bron (LRD_URL). De LRD voert dit DATA-object zelf ook als code uit. Evalueren voegt
  // dus geen vertrouwensgrens toe. Een JSON5-parser van een CDN zou de pagina afhankelijk
  // maken van internet in de zaal. De fetch hieronder weigert een antwoord van een andere bron.
  const data = new Function('return (' + objectLiteraal(script.textContent, 'const DATA = {') + ')')();
  if (!Array.isArray(data?.days) || !data.days.length) throw new Error('DATA.days ontbreekt of is leeg');
  return data;
}

/* ---------- Toestand ---------- */
let DATA = null, dag = null, blokken = [], beginDag = 0, eindDag = 0;
let vorigeSleutel = null, eersteKeer = true;

const typeVan = t => (TYPES.includes(t) ? t : 'inhoud');
const label = t => DATA?.typeLabel?.[t] ?? t;
const gevuld = v => v && !/^[—–-]\s*$/.test(String(v).trim());
const heeftUitkomst = b => gevuld(b.output);
// Eigen werk uit eerdere blokken, pauzes of thuis (DATA.days[].blocks[].uses), los van de online invoer.
const gebruikt = b => (gevuld(b.uses) ? `<b>Je gebruikt:</b> ${esc(b.uses)}` : '');

/* De werkkaart (DATA.days[].blocks[].deelnemer): zeven vaste vragen, in drie groepen.
   Eerst wat je nodig hebt, waar je op let en wat je moet weten; dan wat je doet; dan of je
   goed zit, wanneer je klaar bent en waarvoor je de trainer vraagt. */
const WERK = [
  [['nodig', 'Je hebt nodig'], ['aandacht', 'Let vooral op'], ['weten', 'Je moet weten']],
  [['doen', 'Wat je doet']],
  [['koers', 'Je zit goed als'], ['af', 'Je bent klaar als'], ['hulp', 'Vraag de trainer']],
];
const lijstOf = v => (Array.isArray(v) ? v : gevuld(v) ? [v] : []).filter(gevuld);
function werkkaart(b) {
  const w = b.deelnemer;
  if (!w) return '';
  const groepen = WERK.map(groep => {
    const delen = groep.map(([k, kop]) => {
      let dd = '';
      if (k === 'doen') {
        const stappen = lijstOf(w.doen);
        if (stappen.length) dd = `<ol>${stappen.map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
      } else if (gevuld(w[k])) dd = `<p>${esc(w[k])}</p>`;
      // Wat de deelnemer eerder maakte, staat bij wat je nodig hebt, met de bron erbij.
      if (k === 'nodig' && gevuld(b.uses)) dd += `<p class="wk-uit">Uit eerder werk: ${esc(b.uses)}</p>`;
      return dd ? `<div><dt>${kop}</dt><dd>${dd}</dd></div>` : '';
    }).join('');
    return delen ? `<dl class="wk-groep${groep[0][0] === 'doen' ? ' is-doen' : ''}">${delen}</dl>` : '';
  }).join('');
  return groepen ? `<div class="werkkaart">${groepen}</div>` : '';
}

/* Alleen voor de trainer (DATA.days[].blocks[].trainer): klaarzetten, verloop met tijden,
   en waar de trainer op let. Wordt alleen aangeroepen als TRAINER waar is. */
const STAP_TIJD = /^(\d{1,2}:\d{2})\s+/;
function trainerBlok(b) {
  const t = b.trainer;
  if (!t) return '';
  const stappen = lijstOf(t.verloop).map(s => {
    const m = STAP_TIJD.exec(s);
    return m ? `<li data-tijd="${esc(m[1])}"><b class="tr-tijd">${esc(m[1])}</b> ${esc(s.slice(m[0].length))}</li>` : `<li>${esc(s)}</li>`;
  }).join('');
  const deel = (kop, dd) => (dd ? `<div><dt>${kop}</dt><dd>${dd}</dd></div>` : '');
  return `<p class="tr-kop">Alleen voor de trainer</p><dl>`
    + deel('Klaarzetten', gevuld(t.klaarzetten) ? esc(t.klaarzetten) : '')
    + deel('Verloop', stappen ? `<ol>${stappen}</ol>` : '')
    + deel('Let op', gevuld(t.letop) ? esc(t.letop) : '')
    + '</dl>';
}
/* De stap van het verloop die nu loopt, licht op in de kop van de trainer. */
function kleurStap(nu) {
  const el = $('nu-trainer');
  if (!el) return;
  const t = nuSec();
  const items = [...el.querySelectorAll('li[data-tijd]')];
  let actief = null;
  if (nu.soort === 'blok') for (const li of items) if (hm(li.dataset.tijd) <= t) actief = li;
  items.forEach(li => li.classList.toggle('is-nu', li === actief));
}

function dagNummers() { return DATA.days.map(d => d.n); }
function standaardDag() {
  const gevraagd = +params.get('dag');
  if (dagNummers().includes(gevraagd)) return gevraagd;
  const vandaag = datumNL.format(new Date());
  const mijlpaal = (DATA.milestones || []).find(m => m.date === vandaag && /^Dag\s+\d+$/.test(m.label));
  const n = mijlpaal ? +mijlpaal.label.replace(/\D/g, '') : NaN;
  return dagNummers().includes(n) ? n : (dagNummers().includes(1) ? 1 : DATA.days[0].n);
}

/* ---------- Opbouw van een dag ---------- */
function kiesDag(n, metUrl = true) {
  dag = DATA.days.find(d => d.n === n) || DATA.days[0];
  blokken = (dag.blocks || []).map((b, i) => ({ ...b, i, t: typeVan(b.t), sec: hm(b.s), eSec: hm(b.e) }))
    .filter(b => Number.isFinite(b.sec) && Number.isFinite(b.eSec) && b.eSec > b.sec);
  beginDag = Math.min(...blokken.map(b => b.sec));
  eindDag = Math.max(...blokken.map(b => b.eSec));
  if (metUrl) {
    const u = new URL(location.href); u.searchParams.set('dag', dag.n);
    try { history.replaceState(null, '', u); } catch { /* geen geschiedenis */ }
  }
  $('dagtitel').textContent = `Dag ${dag.n} · ${dag.date} · ${dag.title}`;
  $('dagen').innerHTML = DATA.days.map(d =>
    `<a class="pil" href="?dag=${esc(d.n)}${TRAINER ? '&amp;rol=trainer' : ''}" data-dag="${esc(d.n)}"${d.n === dag.n ? ' aria-current="page"' : ''}>Dag ${esc(d.n)}</a>`).join('');
  // De link naar de weergave voor de deelnemers volgt de dag (en een proeftijd).
  const zaal = $('naar-zaal');
  if (zaal) { const u = new URL(location.href); u.searchParams.delete('rol'); u.searchParams.set('dag', dag.n); zaal.href = u.href; }
  tekenVragen();
  tekenTijdlijn();
  tekenLijst();
  // Een andere dag begint bovenaan, met de kop in beeld.
  if (!eersteKeer) window.scrollTo({ top: 0, behavior: 'instant' });
  vorigeSleutel = null;
  ververs();
}

/* Een href uit DATA wordt een adres naast de LRD; alleen http(s) mag. */
function materiaalUrl(m) {
  if (!m || !m.href) return null;
  let url;
  try { url = new URL(m.href, LRD_URL); } catch { return null; }
  if (!/^https?:$/.test(url.protocol)) return null;
  return { url, extern: url.origin !== location.origin };
}

function tegel(m) {
  const doel = materiaalUrl(m);
  if (!doel) return '';
  const { url, extern } = doel;
  return `<a class="tegel${extern ? ' is-extern' : ''}" href="${esc(url.href)}"${extern ? ' target="_blank" rel="noopener noreferrer"' : ''}>`
    + `<span>${esc(m.label || url.pathname.split('/').pop())}</span>`
    + `<span class="tegel-pijl" aria-hidden="true">${extern ? '↗' : '→'}</span>`
    + (extern ? '<span class="sr"> (opent in een nieuw tabblad)</span>' : '')
    + '</a>';
}

/* Een pauze is een smalle rij: haar materiaal staat als gewone link achter de AI-taak,
   in de rij en in de band van werkregel 1. */
function pauzeLinks(b) {
  return (Array.isArray(b.materials) ? b.materials : []).map(m => {
    const doel = materiaalUrl(m);
    if (!doel) return '';
    const { url, extern } = doel;
    return ` <a class="pauze-link" href="${esc(url.href)}"${extern ? ' target="_blank" rel="noopener noreferrer"' : ''}>${esc(m.label || url.pathname.split('/').pop())}&nbsp;${extern ? '↗' : '→'}</a>`;
  }).join('');
}

function tekenLijst() {
  const lijst = $('lijst');
  lijst.innerHTML = blokken.map(b => {
    const min = Math.round((b.eSec - b.sec) / 60);
    if (b.t === 'pauze') {
      return `<li class="rij is-pauze" id="blok-${b.i}" data-blok-rij="${b.i}">
        <div class="rij-tijd"><span class="van-tot">${esc(b.s)}–${esc(b.e)}</span></div>
        <div class="rij-inhoud"><span class="pauze-titel">${esc(b.title)}</span><span class="nu-badge">Nu</span>${b.aiTask ? `<span class="pauze-ai"><b>AI aan het werk:</b> ${esc(b.aiTask)}${pauzeLinks(b)}</span>` : ''}</div></li>`;
    }
    const mat = Array.isArray(b.materials) ? b.materials.map(tegel).filter(Boolean) : [];
    return `<li class="rij" id="blok-${b.i}" data-blok-rij="${b.i}">
      <div class="rij-tijd"><span class="van-tot">${esc(b.s)}–${esc(b.e)}</span><span class="duur">${min} min</span></div>
      <div class="rij-inhoud">
        <div class="rij-meta"><span class="type"><span class="staal t-${b.t}"></span>${esc(label(b.t))}</span><span class="nu-badge">Nu</span></div>
        <h2 class="rij-titel">${esc(b.title)}</h2>
        ${gebruikt(b) ? `<p class="maakt">${gebruikt(b)}</p>` : ''}
        ${heeftUitkomst(b) ? `<p class="maakt"><b>Je maakt:</b> ${esc(b.output)}</p>` : ''}
        ${mat.length ? `<div class="tegels">${mat.join('')}</div>` : ''}
        ${werkkaart(b) ? `<details class="werk"><summary>Zo werk je in dit blok</summary>${werkkaart(b)}</details>` : ''}
        ${TRAINER && trainerBlok(b) ? `<section class="trainer" aria-label="Voor de trainer">${trainerBlok(b)}</section>` : ''}
      </div></li>`;
  }).join('');
  $('laden').hidden = true;
  lijst.hidden = false;
}

/* De vier vragen uit DATA.vragen. Zonder vragen blijft de band zoals hij was. */
function tekenVragen() {
  const el = $('vragen'), vr = Array.isArray(DATA.vragen) ? DATA.vragen : [];
  el.hidden = !vr.length;
  el.innerHTML = vr.map(q => `<li class="vraag-chip" data-v="${esc(q.id)}" title="${esc(q.vraag)}"><b>${esc(q.id)}</b>${esc(q.kort)}</li>`).join('');
}
/* De vragen van het blok lichten op in de band en staan voluit in de kop, met de plek
   waar de deelnemer ze op papier heeft: de vragenkaart (ADR-046). */
function kleurVragen(b) {
  const actief = new Set(b && Array.isArray(b.v) ? b.v : []);
  document.querySelectorAll('.vraag-chip').forEach(c => c.classList.toggle('is-actief', actief.has(c.dataset.v)));
  const vr = (Array.isArray(DATA.vragen) ? DATA.vragen : []).filter(q => actief.has(q.id));
  $('nu-vragen').hidden = !vr.length;
  $('nu').classList.toggle('met-vragen', vr.length > 0);
  const telwoord = ['', 'een', 'twee', 'drie', 'vier'][vr.length] ?? String(vr.length);
  $('nu-vragen-kop').textContent = !vr.length ? ''
    : vr.length === DATA.vragen.length ? `De ${telwoord} vragen`
    : vr.length === 1 ? 'De vraag van dit blok' : `De ${telwoord} vragen van dit blok`;
  $('nu-vragen-lijst').innerHTML = vr.map(q =>
    `<li><span class="nv-kop"><b>${esc(q.id)}</b>${esc(q.kort)}</span>${esc(q.vraag)}</li>`).join('');
}

const pos = sec => ((sec - beginDag) / (eindDag - beginDag)) * 100;
function tekenTijdlijn() {
  $('spoor').innerHTML = blokken.map(b =>
    `<div class="balk t-${b.t}" data-blok="${b.i}" title="${esc(b.s)} ${esc(b.title)}" style="left:${pos(b.sec)}%;width:calc(${pos(b.eSec) - pos(b.sec)}% - 2px)"><span>${esc(b.title)}</span></div>`
  ).join('') + '<span class="pin" id="pin" hidden></span>';
  const ticks = [beginDag];
  for (let h = Math.ceil(beginDag / 3600) * 3600; h < eindDag; h += 3600) if (h > beginDag) ticks.push(h);
  if (eindDag > ticks[ticks.length - 1]) ticks.push(eindDag);
  $('ticks').innerHTML = ticks.map((t, k) => {
    const rand = k === 0 ? ' is-begin' : k === ticks.length - 1 ? ' is-eind' : '';
    const dicht = !rand && (t - beginDag < 2700 || eindDag - t < 2700) ? ' is-dicht' : '';
    return `<span class="tick${rand}${dicht}" style="left:${pos(t)}%">${klokTekst(t)}</span>`;
  }).join('');
}

/* ---------- Waar staan we? ---------- */
function bepaal() {
  const t = nuSec();
  const b = blokken.find(x => x.sec <= t && t < x.eSec);
  if (b) return { soort: 'blok', b, rest: b.eSec - t, pin: t };
  if (t < beginDag) return { soort: 'voor', b: blokken.find(x => x.sec === beginDag) };
  if (t >= eindDag) return { soort: 'na' };
  const volgende = blokken.filter(x => x.sec > t).sort((p, q) => p.sec - q.sec)[0];
  return { soort: 'tussen', b: volgende, pin: t };
}
const naBlok = b => blokken.filter(x => x.sec >= b.eSec && x.i !== b.i).sort((p, q) => p.sec - q.sec)[0];

/* Werkregel 1 uit het regelboek (DATA.rules): in de laatste vijf minuten vóór een pauze en
   tijdens de pauze, met de AI-taak van die pauze. Staat in de band onder de tijdlijn, zodat hij
   ook in beeld is als de kop is weggerold. Staat buiten de sleutel van ververs(), omdat het
   omslagpunt midden in een blok valt. */
let vorigeRegel = '';
function toonRegel(nu) {
  const regel = (DATA.rules || []).find(r => r.n === 1 && r.text);
  let pauze = null;
  if (regel && nu.soort === 'blok') {
    if (nu.b.t === 'pauze') pauze = nu.b;
    else if (nu.rest <= VIJF_MIN) { const v = naBlok(nu.b); if (v?.t === 'pauze') pauze = v; }
  }
  const html = pauze
    ? `<b>Werkregel 1</b> · ${esc(regel.text)}${pauze.aiTask ? `<br><b>Idee:</b> ${esc(pauze.aiTask)}${pauzeLinks(pauze)}` : ''}`
    : '';
  if (html === vorigeRegel) return;
  const verschijnt = !vorigeRegel && !!html;
  vorigeRegel = html;
  const el = $('regel');
  el.hidden = !html;
  el.innerHTML = html;
  meetBand();
  if (verschijnt && !eersteKeer) $('melding').textContent = `Werkregel 1: ${regel.text}`;
}

function ververs() {
  if (!dag) return;
  const nu = bepaal();
  const sleutel = `${dag.n}|${nu.soort}|${nu.b?.i ?? ''}`;

  // Pin op de tijdlijn
  const pin = $('pin');
  if (pin) {
    const zichtbaar = nu.pin != null && nu.pin >= beginDag && nu.pin <= eindDag;
    pin.hidden = !zichtbaar;
    if (zichtbaar) pin.style.left = `${pos(nu.pin)}%`;
  }
  toonRegel(nu);
  if (TRAINER) kleurStap(nu);

  if (sleutel === vorigeSleutel) return;
  vorigeSleutel = sleutel;

  kleurVragen(nu.soort === 'na' ? null : nu.b);
  meetBand();

  // Tekst bij "nu"
  const zet = (id, html) => { const el = $(id); el.hidden = !html; el.innerHTML = html || ''; };
  // Wat je eerder maakte ("Je gebruikt") staat in de kop op de werkkaart, bij wat je nodig hebt.
  let nuLabel = '', nuTitel = '', maakt = '', daarna = '';
  if (nu.soort === 'blok') {
    nuLabel = `Nu · ${label(nu.b.t)} · ${nu.b.s}–${nu.b.e}`; nuTitel = nu.b.title;
    if (nu.b.t !== 'pauze' && heeftUitkomst(nu.b)) maakt = `<b>Je maakt:</b> ${esc(nu.b.output)}`;
    if (nu.b.t !== 'pauze' && !nu.b.deelnemer && gebruikt(nu.b)) maakt = gebruikt(nu.b) + (maakt ? '<br>' + maakt : '');
    const v = naBlok(nu.b);
    daarna = v ? `Daarna: ${esc(v.title)}` : '';
  } else if (nu.soort === 'voor' || nu.soort === 'tussen') {
    nuLabel = `Straks · ${label(nu.b.t)} · om ${nu.b.s}`; nuTitel = nu.b.title;
    if (heeftUitkomst(nu.b)) maakt = `<b>Je maakt:</b> ${esc(nu.b.output)}`;
    if (!nu.b.deelnemer && gebruikt(nu.b)) maakt = gebruikt(nu.b) + (maakt ? '<br>' + maakt : '');
  } else {
    const volgende = DATA.days.filter(d => d.n > dag.n).sort((p, q) => p.n - q.n)[0];
    nuLabel = volgende ? 'Volgende lesdag' : 'Afgelopen';
    nuTitel = volgende ? `Dag ${volgende.n} · ${volgende.date} · ${volgende.title}` : 'Dit was de laatste lesdag.';
  }
  $('nu-label').textContent = nuLabel;
  $('nu-titel').textContent = nuTitel;
  zet('nu-maakt', maakt);
  zet('nu-daarna', daarna);
  // Het materiaal van dit blok staat ook in de kop: één klik, zonder te scrollen.
  const kopBlok = nu.soort === 'na' || nu.b?.t === 'pauze' ? null : nu.b;
  zet('nu-tegels', kopBlok && Array.isArray(kopBlok.materials) ? kopBlok.materials.map(tegel).join('') : '');
  // De werkkaart van dit blok, en voor de trainer de instructie erboven.
  zet('nu-werk', kopBlok ? werkkaart(kopBlok) : '');
  if (TRAINER) { zet('nu-trainer', kopBlok ? trainerBlok(kopBlok) : ''); kleurStap(nu); }

  // Markering in tijdlijn en lijst
  const huidig = nu.soort === 'blok' ? nu.b : null;
  document.querySelectorAll('.balk').forEach(el => {
    const b = blokken.find(x => x.i === +el.dataset.blok);
    let later = false;
    if (huidig) later = b.sec >= huidig.eSec;
    else if (nu.soort === 'voor' || nu.soort === 'tussen') later = b.sec >= nu.b.sec;
    el.classList.toggle('is-nu', b === huidig);
    el.classList.toggle('is-later', later);
  });
  document.querySelectorAll('[data-blok-rij]').forEach(el => {
    const nuHier = huidig && +el.dataset.blokRij === huidig.i;
    el.classList.toggle('is-nu', !!nuHier);
    if (nuHier) el.setAttribute('aria-current', 'step'); else el.removeAttribute('aria-current');
    // De werkkaart van het blok van nu gaat open; die van het vorige blok gaat weer dicht.
    // Een werkkaart die iemand zelf opende, blijft open. Latere blokken blijven dicht.
    const werk = el.querySelector('.werk');
    if (werk && nuHier) { werk.open = true; werk.dataset.auto = '1'; }
    else if (werk && werk.dataset.auto) { werk.open = false; delete werk.dataset.auto; }
  });

  // Melden, en het nieuwe blok in beeld brengen. Alleen als de kop al is weggerold:
  // wie bovenaan staat, houdt het overzicht van de kop.
  if (!eersteKeer) {
    $('melding').textContent = huidig ? `Nu: ${huidig.title}.` : nu.soort === 'na' ? 'De lesdag is afgelopen.' : nuTitel;
    const doel = huidig || (nu.soort === 'voor' || nu.soort === 'tussen' ? nu.b : null);
    if (doel && kop.getBoundingClientRect().bottom <= 0) { meetBand(); naarBlok(doel.i); }
  }
  eersteKeer = false;
}

/* ---------- Bediening ---------- */
document.addEventListener('click', e => {
  const dagLink = e.target.closest('[data-dag]');
  if (dagLink) { e.preventDefault(); kiesDag(+dagLink.dataset.dag); return; }
  // Een blok in de tijdlijn brengt dat blok in de lijst in beeld.
  const balk = e.target.closest('.balk');
  if (balk) naarBlok(balk.dataset.blok);
});
document.addEventListener('keydown', e => {
  if (!DATA || e.altKey || e.ctrlKey || e.metaKey || e.isComposing) return;
  if (e.target.closest?.('input, textarea, select, [contenteditable="true"]')) return;
  const nrs = dagNummers(), k = nrs.indexOf(dag.n);
  if (e.key === 'ArrowLeft' && k > 0) { e.preventDefault(); kiesDag(nrs[k - 1]); }
  else if (e.key === 'ArrowRight' && k < nrs.length - 1) { e.preventDefault(); kiesDag(nrs[k + 1]); }
  else if (/^[1-9]$/.test(e.key) && nrs.includes(+e.key)) { e.preventDefault(); kiesDag(+e.key); }
});

new ResizeObserver(meetBand).observe(band);
setInterval(ververs, 1000);

/* ---------- Trainersweergave ----------
   Alleen met ?rol=trainer: een band die zegt dat dit niet op de beamer hoort, met een link
   naar de weergave voor de deelnemers; de instructie van het blok van nu in de kop; en in de
   voet het draaiboek en het ontwerp. Niets hiervan staat in de HTML van de pagina zelf. */
function maakTrainerweergave() {
  document.title = 'Trainer · Lesdag AISO26009';
  $('kop').querySelector('.kop-binnen').insertAdjacentHTML('afterbegin',
    `<p class="rol-band"><span><b>Trainersweergave.</b> Alleen op je eigen scherm, niet op de beamer.</span>`
    + `<a id="naar-zaal" href="./" target="_blank" rel="noopener">Weergave voor de deelnemers&nbsp;↗<span class="sr"> (opent in een nieuw tabblad)</span></a></p>`);
  $('nu-werk').insertAdjacentHTML('beforebegin',
    '<section class="nu-trainer trainer" id="nu-trainer" aria-label="Voor de trainer" hidden></section>');
  document.querySelector('footer .binnen').insertAdjacentHTML('beforeend',
    `<span class="voet-links"><a href="${DRAAIBOEK}" target="_blank" rel="noopener noreferrer">Draaiboek voor de trainer&nbsp;↗<span class="sr"> (opent in een nieuw tabblad)</span></a>`
    + `<a href="../LRD-AISO26009-lesdagen.html">Ontwerp (LRD)</a></span>`);
}

/* ---------- Start ---------- */
function fout(soort, err) {
  $('laden').hidden = true;
  const detail = err ? `<p class="fout">Foutmelding: ${esc(err.message || err)}</p>` : '';
  const server = `<ol>
      <li>Open de map van de repo in VS Code en start Live Server (poort 5501). Ga dan naar <code>http://127.0.0.1:5501/materiaal/</code>.</li>
      <li>Of typ in de map van de repo <code>python3 -m http.server</code> en ga naar <code>http://127.0.0.1:8000/materiaal/</code>.</li>
    </ol>`;
  const tekst = soort === 'lezen'
    ? `<h2>Het programma is niet te lezen</h2><p>De LRD is geladen, maar het DATA-object klopt niet. Controleer de LRD en laad de pagina opnieuw.</p>`
    : `<h2>Open deze pagina via een lokale server</h2><p>De pagina leest het programma uit de LRD. Dat lukt alleen als een webserver de bestanden aanbiedt. Een bestand dat je direct opent, kan de LRD niet ophalen.</p>${server}`;
  $('inhoud').insertAdjacentHTML('afterbegin', `<section class="melding-kaart" role="alert">${tekst}${detail}</section>`);
}

(async () => {
  if (location.protocol === 'file:') return fout('server');
  let html;
  try {
    if (LRD_URL.origin !== location.origin) throw new Error('de LRD staat niet op dezelfde bron');
    const r = await fetch(LRD_URL, { cache: 'no-cache', redirect: 'error' });
    if (!r.ok) throw new Error(`de LRD gaf status ${r.status}`);
    if (new URL(r.url).origin !== location.origin) throw new Error('de LRD kwam van een andere bron');
    html = await r.text();
  } catch (err) { return fout('server', err); }
  try { DATA = leesData(html); } catch (err) { return fout('lezen', err); }
  if (TRAINER) maakTrainerweergave();
  $('nu').hidden = false;
  band.hidden = false;
  kiesDag(standaardDag(), params.has('dag'));
})();
</script>
</body>
</html>
