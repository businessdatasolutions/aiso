<!doctype html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">

<title>AI in het ziekenhuis</title>
<style>
/* Praatplaat bij "Wat AI nu kan en niet kan" (dag 1): een maquette van een ziekenhuis met cijfers uit de
   AI Monitor Ziekenhuizen 2026. Gekopieerd uit de presentatie over AI in de zorg (src/architectuur.css en
   src/ziekenhuis.css), zonder de delen die deze pagina niet gebruikt (ADR-040).
   Huisstijl Business Data Solutions (brand-project/stylebook/shared.css), alleen licht. Geel (--accent) is het merkaccent:
   het markeert de ruimte of het label dat nu aan de beurt is. AI = warm zwart met geel licht plus het Bot-icoon.
   Cijfers uit de monitor zijn mensenwerk: wit of crème met een zwarte rand, zonder AI-markering. */
:root{
  color-scheme:light;
  --paper:#f9f8f4; --card:#fff; --ink:#1a1a1a; --line:#e5e7eb; --cream:#f5f0e6; --cream2:#f0ebe0;
  --muted:#4b5563; --mutedSoft:#6b7280; --accent:#d4db3e; --accentSoft:#fafbf0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",Monaco,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{font-size:clamp(12px,1.05vw,22px);background:var(--paper)}
body{margin:0;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 4px minmax(0,1fr) auto;background:var(--paper);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
svg.i{width:1em;height:1em;flex-shrink:0}
[hidden]{display:none !important}

header.top{display:flex;align-items:flex-end;gap:2rem;padding:1.3rem 2.2rem .9rem}
.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mutedSoft);font-weight:600}
h1{font-size:2rem;margin:.25rem 0 0;letter-spacing:-.02em;line-height:1.15}
.teller{margin-left:auto;font-family:var(--mono);color:var(--mutedSoft);font-size:.9rem;white-space:nowrap}
.voortgang{background:var(--line)}
.voortgang i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s ease}

main{position:relative;min-height:0}
.scene{position:absolute;inset:0}

/* ---------- Het doek met de maquette ---------- */
#maquette{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr)}
/* de hele plaat: het doek over de volle breedte, de uitleg als smalle band eronder */
#maquette.plaat{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
#maquette.plaat .uitleg{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2rem 1.4rem;padding:.5rem 2.2rem .8rem;
  border-top:1px solid var(--line)}
#maquette.plaat .uitleg .laag{display:none}
#maquette.plaat .uitleg h2{font-size:1.7rem;margin:0}
#maquette.plaat .uitleg p{font-size:1.2rem;margin:0}

.doek{position:relative;min-width:0;min-height:0;overflow:hidden}
.doek canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.labels{position:absolute;inset:0;pointer-events:none}
.geen-maquette{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:2rem;text-align:center;
  color:var(--muted);font-size:1.2rem}

/* ---------- Labels op de maquette ---------- */
.lbl{position:absolute;left:0;top:0;font-weight:700;font-size:1.05rem;white-space:nowrap;padding:.15rem .6rem;border-radius:.4rem;
  display:inline-flex;gap:.4rem;align-items:center;transition:background .3s,opacity .3s,color .3s}
.lbl.kamer{transform:translate(-50%,calc(-100% - .8rem));align-items:baseline;gap:.45rem;background:#fff;
  border:1.5px solid var(--ink);padding:.12rem .65rem .18rem;line-height:1.1;pointer-events:auto;cursor:pointer;font:inherit;color:var(--ink)}
.lbl.kamer::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:.8rem;background:var(--ink)}
.lbl.kamer b{font-size:1.45rem;letter-spacing:-.01em}
.lbl.kamer span{font-size:.9rem;font-weight:600;color:var(--muted)}
.lbl.kamer.leeg{background:var(--cream)}
.lbl.kamer.leeg b{color:var(--mutedSoft)}
.lbl.kamer.aan{background:var(--accent)}
.lbl.kamer.aan span{color:var(--ink)}
.lbl.kamer:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.lbl.roep{transform:translate(-50%,calc(-100% - .6rem));font-size:.95rem;background:#fff;border:1.5px solid var(--ink);padding:.15rem .6rem}
.lbl.roep::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:.6rem;background:var(--ink)}
.lbl.roep.ai{background:var(--ink);color:var(--accent);border-color:var(--ink)}
.lbl.roep.ai::after{background:var(--accent)}
.lbl.roep.aan{background:var(--accent)}
.lbl.weg{opacity:0;visibility:hidden;pointer-events:none}

.legenda{position:absolute;right:1rem;top:.9rem;display:inline-flex;align-items:center;gap:.45rem;background:var(--ink);color:var(--accent);
  border-radius:99px;padding:.25rem .8rem;font-size:.85rem;font-weight:700}
.legenda span{color:#fff;font-weight:600}

/* ---------- De uitleg ---------- */
.uitleg{align-self:center;padding:0 2.4rem 0 1rem}
.uitleg .laag{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mutedSoft);font-weight:600}
.uitleg h2{font-size:2.3rem;margin:.35rem 0 .7rem;line-height:1.12;letter-spacing:-.02em;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.uitleg p{font-size:1.4rem;line-height:1.45;color:var(--muted);margin:0 0 .6rem}
#maquette .uitleg p{font-size:1.2rem;margin-bottom:.5rem}
#maquette .uitleg h2{font-size:2.1rem}
.uitleg .bron{font-size:.85rem !important;color:var(--mutedSoft) !important;margin-top:.9rem !important}
.uitleg .grafiek{margin:.4rem 0 .8rem}
.uitleg ul.als-tekst{margin:.2rem 0 .8rem;padding-left:1.2rem;font-size:1.1rem;line-height:1.5;color:var(--muted)}
svg.staven{width:100%;height:auto;display:block}
svg.staven text{font-family:var(--sans);font-size:15px;fill:var(--ink)}
svg.staven .waarde{font-weight:700;font-size:16px}
svg.staven .staaf{fill:var(--mutedSoft)}
svg.staven .acc .staaf{fill:var(--accent)}
svg.staven .acc .naam{font-weight:700}

.cijfers{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin:.6rem 0 .9rem}
.cijfer{background:var(--cream);border-radius:.7rem;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.2rem}
.cijfer b{font-size:2.3rem;line-height:1}
.cijfer span{color:var(--muted);font-size:1rem;line-height:1.3}

.personen{display:flex;flex-wrap:wrap;align-items:center;gap:.15rem;margin:.4rem 0 .9rem;color:var(--line)}
.personen span{display:inline-flex}
.personen svg{width:1.9rem;height:1.9rem}
.personen .ja{color:var(--ink)}
.personen small{flex-basis:100%;color:var(--muted);font-size:.95rem;margin-top:.2rem}

.vraag{display:flex;gap:.6rem;align-items:center;background:var(--accent);border-radius:.6rem;padding:.6rem .9rem;font-weight:700;font-size:1.25rem;margin-top:.4rem}
.vraag svg{width:1.5rem;height:1.5rem}

/* ---------- Bediening ---------- */
nav.bediening{display:flex;align-items:center;gap:.8rem;padding:.6rem 2.2rem;border-top:1px solid var(--line);font-size:.85rem;color:var(--mutedSoft)}
nav.bediening button{font:inherit;font-size:1rem;font-weight:700;border:1px solid var(--ink);background:#fff;color:var(--ink);
  border-radius:.4rem;padding:.2rem .9rem;cursor:pointer}
nav.bediening button.volgende{background:var(--accent);border-color:var(--accent)}
nav.bediening a{color:var(--muted);text-decoration:none;border-bottom:2px solid var(--accent)}
nav.bediening .bron{font-size:.8rem;color:var(--mutedSoft)}
.merk{margin-left:auto;display:flex;align-items:center;gap:.4rem;color:var(--ink);font-weight:700;font-size:.8rem}
.merk svg{width:1.3rem;height:1.3rem}

@media (max-width:760px){
  header.top,nav.bediening{padding-left:1rem;padding-right:1rem}
  nav.bediening > span:not(.merk){display:none} /* hint en bron: de bron staat ook bij elke stap */
  #maquette{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) auto}
  #maquette .uitleg{padding:.6rem 1rem 1rem;overflow:auto}
  #maquette.plaat .uitleg{left:.8rem;right:.8rem;bottom:.8rem}
  .legenda{right:.6rem;top:.6rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important}
}
</style>
</head>

<script type="module">
/* Praatplaat bij "Wat AI nu kan en niet kan" (dag 1, FR-26): een maquette van een ziekenhuis met de cijfers uit de
   AI Monitor Ziekenhuizen 2026 (M&I/Partners, maart 2026) op de plek waar ze horen. Het is een voorbeeld uit een andere
   sector: zeg erbij dat het uit de zorg komt.
   Gekopieerd uit de presentatie over AI in de zorg van 10 november 2026 (ziekenhuis.html, src/ziekenhuis.js en
   src/ziekenhuis-maquette.js; ADR-040). Anders dan daar: één bestand, de bibliotheken komen van jsDelivr in de versies
   van de LRD, en de verwijzingen naar het programma van die sessie zijn eruit.
   Eerst de hele plaat. Daarna zoomt de camera per stap in op een ruimte: de bestuurskamer (hoe snel gaat het?), de
   afdelingen (waar zit AI al?), kwaliteit en de AI-regiegroep, en het patroon "AI selecteert, de mens beslist" op de
   radiologie en bij de incidentmeldingen. Tot slot weer de hele plaat.
   Three.js tekent de maquette, D3 de grafieken, motion de overgangen. Elk wordt apart geladen: zonder Three.js of D3
   blijft de tekst per stap werken, zonder motion staat alles meteen op zijn plek.
   Spreker stuurt: → / ← / spatie / klikker, #stap-N.
   AI-markering (zwart, geel, Bot-icoon) alleen voor wat AI doet; de cijfers zelf zijn mensenwerk.
   Paginanummers (p.) verwijzen naar het pdf-bestand van de monitor. */

const CDN = {
  three: "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  d3: "https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm",
  motion: "https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm",
};
const laad = (url, naam) => import(url).catch((e) => { console.warn(`${naam} niet geladen.`, e); return null; });
const [THREE, d3, M] = await Promise.all([laad(CDN.three, "Three.js"), laad(CDN.d3, "D3"), laad(CDN.motion, "Motion")]);

// Zonder motion: meteen de eindstand. Elementen staan al zichtbaar; bij objecten (camera, posities) telt de laatste waarde.
function meteen(doel, waarden, opties = {}) {
  const lijst = Array.isArray(doel) || doel instanceof NodeList ? [...doel] : [doel];
  for (const d of lijst) {
    if (d instanceof Element) continue;
    for (const [k, w] of Object.entries(waarden)) d[k] = Array.isArray(w) ? w[w.length - 1] : w;
  }
  opties.onUpdate?.();
  return { stop() {}, then: (f) => Promise.resolve().then(f) };
}
const animate = M ? M.animate : meteen;
const stagger = M ? M.stagger : () => 0;

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const T = (s) => (reduce ? 0 : s);
const $ = (id) => document.getElementById(id);

// lucide "bot", "user-round" en "hand"
const BOT = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>';
const MENS = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>';
const HAND = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>';

/* ================= De cijfers (AI Monitor Ziekenhuizen 2026) ================= */

// [proces, %, ruimte in de maquette] (p. 27)
const PROCESSEN = [["Administratie en facturatie", 80, "admin"], ["Diagnostiek", 71, "radiologie"], ["Communicatie", 65, "balie"], ["Onderzoek", 53, "lab"], ["Zorglogistiek", 49, "gang"]];
const SCHAAL = [["Zeer klein of niet", 4], ["Klein", 42], ["Gemiddeld", 46], ["Groot", 8], ["Zeer groot", 0]]; // p. 25, grafiek 2026
const RADIOLOGIE = [["2024", 78], ["2025", 62], ["2026", 41]]; // p. 28, afgeleid uit 41% (-21 en -37)
const BELEID = [["2024", 30], ["2025", 50], ["2026", 76]]; // p. 16

// Label boven elke ruimte in het overzicht: [cijfer, wat het meet]. De naam van de ruimte staat op de vloer.
const KAMERLABEL = {
  bestuur: ["90%", "generatieve AI"],
  regie: ["60%", "heeft een AI-board"],
  radiologie: ["71%", "diagnostiek"],
  lab: ["53%", "onderzoek"],
  balie: ["65%", "communicatie"],

};

// Labels bij een ding in een ruimte. ai = AI-markering; mens = mens-icoon; aan = geel accent.
const ROEP = {
  ct: { tekst: "CT: fractuurdetectie" },
  aiRadio: { tekst: "AI: eerste selectie", ai: true },
  radioloog: { tekst: "Radioloog beslist", mens: true, aan: true },
  aiPoli: { tekst: "AI vat het consult samen", ai: true },

};

/* ================= De plattegrond ================= */

const KLEUR = {
  inkt: 0x1a1a1a, geel: 0xd4db3e, wit: 0xffffff, creme: 0xf5f0e6, creme2: 0xf0ebe0,
  lijn: 0xe5e7eb, grijs: 0x9ca3af, mid: 0x6b7280, donker: 0x4b5563, papier: 0xf9f8f4, boom: 0xd1d5db,
};

// [x0, x1] en [z0, z1] van elke ruimte. De gang loopt van x -16 tot 16, tussen z -1,2 en 1,2.
const KAMERS = {
  bestuur: { x: [-16, -7], z: [-10, -1.2] },
  regie: { x: [-7, -1], z: [-10, -1.2] },
  radiologie: { x: [-1, 8], z: [-10, -1.2] },

  poli: { x: [-8, -1], z: [1.2, 10] },

  kwaliteit: { x: [7, 16], z: [1.2, 10] },
  gang: { x: [-16, 16], z: [-1.2, 1.2] },
};

// Naam op de vloer van elke ruimte, zoals op een bouwtekening.
const NAMEN = {
  bestuur: "Bestuurskamer", regie: "AI-regiegroep", radiologie: "Radiologie", lab: "Onderzoek",
  balie: "Entree en balie", poli: "Polikliniek", admin: "Administratie", kwaliteit: "Kwaliteit en veiligheid",
};

// Cijfers op de borden in de bestuurskamer (AI Monitor Ziekenhuizen 2026, p. 30 en 26).
const GENAI = [["2024", 57], ["2025", 75], ["2026", 90]];
const TRECHTER = [["Idee of verkenning", 8], ["Aankoop of ontwikkeling", 3], ["Pilot", 3], ["Implementatie", 1], ["Opgeschaald", 1], ["Beheer", 2]];

/* ================= De maquette (Three.js) =================
   Een typisch ziekenhuis van één verdieping, open van boven, als architectuurmodel. Acht ruimtes rond een gang.
   Wit model met zwarte randen; poppetjes in grijs. AI-toepassingen zijn warm zwart met geel licht. Rond een ruimte
   die aan de beurt is, licht een gele rand op. Alles is code, er zijn geen modelbestanden. Eenheid: ongeveer een
   meter. x loopt van west naar oost, z van achter (noord) naar voor (zuid, de kant van de camera).
   De twee borden in de bestuurskamer zijn canvas-texturen; D3 levert de schalen.
   Alles hierbinnen heeft Three.js en D3 nodig, dus het draait pas als beide geladen zijn. */

function maakMaquette() {
  const MUUR_H = 1.1, MUUR_D = 0.18, GANG = 1.2;
  const NACHT = new THREE.Color(0x24221f);
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif';

  /* ---------- Materialen: 's nachts worden de dagmaterialen donker, het AI-licht niet ---------- */

  const dagMats = [];
  const cache = new Map();
  function mat(soort, kleur) {
    const k = `${soort}-${kleur}`;
    if (!cache.has(k)) {
      const m = soort === "rond" ? new THREE.MeshLambertMaterial({ color: kleur }) : new THREE.MeshBasicMaterial({ color: kleur });
      m.userData.dag = new THREE.Color(kleur);
      dagMats.push(m);
      cache.set(k, m);
    }
    return cache.get(k);
  }
  const vlak = (k) => mat("vlak", k);
  const rond = (k) => mat("rond", k);
  const LIJN = new THREE.LineBasicMaterial({ color: KLEUR.inkt });
  const AI_LICHT = new THREE.MeshBasicMaterial({ color: KLEUR.geel });
  const AI_KAST = new THREE.MeshBasicMaterial({ color: KLEUR.inkt });
  const AI_RAND = new THREE.LineBasicMaterial({ color: KLEUR.geel });

  function zetNacht(scene, licht, f) {
    for (const m of dagMats) m.color.copy(m.userData.dag).lerp(NACHT, 0.86 * f);
    scene.background.setHex(KLEUR.papier).lerp(NACHT, 0.92 * f);
    licht.hemel.intensity = 2.4 - 1.7 * f;
    licht.zon.intensity = 1.6 - 1.3 * f;
  }

  /* ---------- Bouwstenen ---------- */

  // Blok met zwarte randen. y is de onderkant (meubels staan op de vloer).
  function blok(ouder, [w, h, d], [x, y, z], kleur = KLEUR.wit, { rand = true, materiaal } = {}) {
    return blokM(ouder, [w, h, d], [x, y + h / 2, z], kleur, { rand, materiaal });
  }
  // Blok met het midden op [x, y, z].
  function blokM(ouder, [w, h, d], [x, y, z], kleur = KLEUR.wit, { rand = true, materiaal } = {}) {
    const g = new THREE.Group();
    const geo = new THREE.BoxGeometry(w, h, d);
    g.add(new THREE.Mesh(geo, materiaal || vlak(kleur)));
    if (rand) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), LIJN));
    g.position.set(x, y, z);
    ouder.add(g);
    return g;
  }
  function cilinder(ouder, r, h, [x, y, z], kleur = KLEUR.wit, { rand = true, rTop = r } = {}) {
    const geo = new THREE.CylinderGeometry(rTop, r, h, 32);
    const m = new THREE.Mesh(geo, vlak(kleur));
    m.position.set(x, y + h / 2, z);
    ouder.add(m);
    if (rand) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), LIJN);
      e.position.copy(m.position);
      ouder.add(e);
    }
    return m;
  }

  // Muur langs x of langs z, met openingen [midden, breedte].
  function muur(ouder, x1, z1, x2, z2, gaten = []) {
    const langsX = z1 === z2;
    const a = langsX ? Math.min(x1, x2) : Math.min(z1, z2), b = langsX ? Math.max(x1, x2) : Math.max(z1, z2);
    const stukken = [];
    let start = a;
    for (const [m, br] of [...gaten].sort((p, q) => p[0] - q[0])) {
      stukken.push([start, m - br / 2]);
      start = m + br / 2;
    }
    stukken.push([start, b]);
    for (const [s, e] of stukken) {
      if (e - s < 0.02) continue;
      const len = e - s, mid = (s + e) / 2;
      blok(ouder, langsX ? [len, MUUR_H, MUUR_D] : [MUUR_D, MUUR_H, len], langsX ? [mid, 0.02, z1] : [x1, 0.02, mid]);
    }
  }

  // Gele rand op de vloer van een ruimte. Eigen materiaal: zo licht elke ruimte apart op.
  function randOp(ouder, [x0, x1], [z0, z1], inset = 0.32) {
    const m = new THREE.MeshBasicMaterial({ color: KLEUR.geel, transparent: true, opacity: 0, depthWrite: false });
    const a0 = x0 + inset, a1 = x1 - inset, c0 = z0 + inset, c1 = z1 - inset, b = 0.18;
    const strook = (w, d, x, z) => {
      const s = new THREE.Mesh(new THREE.BoxGeometry(w, 0.03, d), m);
      s.position.set(x, 0.05, z);
      ouder.add(s);
    };
    strook(a1 - a0, b, (a0 + a1) / 2, c0);
    strook(a1 - a0, b, (a0 + a1) / 2, c1);
    strook(b, c1 - c0, a0, (c0 + c1) / 2);
    strook(b, c1 - c0, a1, (c0 + c1) / 2);
    return m;
  }

  // Stoel: zitting, rugleuning aan de achterkant (-z), één poot. Kijkt naar +z.
  function stoel(ouder, x, z, rot = 0) {
    const g = new THREE.Group();
    g.position.set(x, 0.02, z);
    g.rotation.y = rot;
    ouder.add(g);
    blok(g, [0.5, 0.08, 0.5], [0, 0.38, 0]);
    blok(g, [0.5, 0.5, 0.08], [0, 0.46, -0.22]);
    blok(g, [0.1, 0.38, 0.1], [0, 0, 0], KLEUR.lijn, { rand: false });
    return g;
  }

  function tafel(ouder, [w, d], [x, z]) {
    blok(ouder, [Math.max(0.3, w - 0.7), 0.68, Math.max(0.3, d - 0.7)], [x, 0.02, z], KLEUR.lijn, { rand: false });
    blok(ouder, [w, 0.06, d], [x, 0.7, z]);
  }

  // Poppetje: kijkt naar +z. rot draait om de y-as; zit = op een stoel; armen = hoek naar voren (radialen).
  function poppetje(ouder, { x = 0, z = 0, y = 0.02, rot = 0, zit = false, armen = 0, jas = KLEUR.donker, broek = KLEUR.mid } = {}) {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    g.rotation.y = rot;
    const cap = (r, l, m) => new THREE.Mesh(new THREE.CapsuleGeometry(r, l, 4, 10), m);
    const HUID = rond(KLEUR.lijn), JAS = rond(jas), BROEK = rond(broek), HAAR = rond(KLEUR.inkt);
    const heup = zit ? 0.5 : 0.92;
    for (const s of [-1, 1]) {
      if (zit) {
        const dij = cap(0.085, 0.36, BROEK);
        dij.rotation.x = Math.PI / 2;
        dij.position.set(s * 0.1, heup, 0.2);
        const scheen = cap(0.075, 0.34, BROEK);
        scheen.position.set(s * 0.1, 0.26, 0.42);
        g.add(dij, scheen);
      } else {
        const been = cap(0.085, 0.7, BROEK);
        been.position.set(s * 0.1, 0.46, 0);
        g.add(been);
      }
    }
    const romp = cap(0.2, 0.36, JAS);
    romp.scale.set(1, 1, 0.72);
    romp.position.y = heup + 0.32;
    const hoofd = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14), HUID);
    hoofd.position.y = heup + 0.78;
    // haar boven en achter: zo zie je welke kant het poppetje op kijkt
    const haar = new THREE.Mesh(new THREE.SphereGeometry(0.148, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.5), HAAR);
    haar.position.y = heup + 0.795;
    haar.rotation.x = -0.5;
    g.add(romp, hoofd, haar);
    for (const s of [-1, 1]) {
      const schouder = new THREE.Group();
      schouder.position.set(s * 0.26, heup + 0.52, 0);
      schouder.rotation.x = -armen;
      const arm = cap(0.06, 0.44, JAS);
      arm.position.y = -0.27;
      const hand = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), HUID);
      hand.position.y = -0.54;
      schouder.add(arm, hand);
      g.add(schouder);
    }
    ouder.add(g);
    return g;
  }

  // Liggend poppetje (op een tafel of bed), hoofd naar -x.
  function liggend(ouder, [x, y, z], opties = {}) {
    const lig = new THREE.Group();
    lig.position.set(x, y, z);
    lig.rotation.y = Math.PI / 2;
    ouder.add(lig);
    const p = poppetje(lig, { ...opties, y: 0 });
    p.rotation.x = -Math.PI / 2;
    return lig;
  }

  // Een AI-toepassing: warm zwart kastje of scherm met geel licht en een gele rand. Het licht wijst naar +z.
  function aiKastje(ouder, [w, h, d], [x, y, z], rot = 0) {
    const g = new THREE.Group();
    g.position.set(x, y + h / 2, z);
    g.rotation.y = rot;
    const geo = new THREE.BoxGeometry(w, h, d);
    const scherm = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.78, h * 0.62), AI_LICHT);
    scherm.position.z = d / 2 + 0.003;
    g.add(new THREE.Mesh(geo, AI_KAST), new THREE.LineSegments(new THREE.EdgesGeometry(geo), AI_RAND), scherm);
    ouder.add(g);
    return g;
  }

  // Een vel of een beeld dat kan bewegen. markeer(true) = de AI heeft het gekozen: zwart met een gele rand.
  function vel(ouder, [w, h, d]) {
    const g = new THREE.Group();
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, vlak(KLEUR.wit));
    const rand = new THREE.LineSegments(new THREE.EdgesGeometry(geo), LIJN);
    const licht = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.6, d * 0.6), AI_LICHT);
    licht.rotation.x = -Math.PI / 2;
    licht.position.y = h / 2 + 0.003;
    licht.visible = false;
    g.add(mesh, rand, licht);
    g.visible = false;
    ouder.add(g);
    return {
      g,
      markeer(aan) {
        mesh.material = aan ? AI_KAST : vlak(KLEUR.wit);
        rand.material = aan ? AI_RAND : LIJN;
        licht.visible = aan;
      },
    };
  }

  function vloerNaam(ouder, tekst, [x0, x1], z) {
    const c = document.createElement("canvas");
    c.width = 1024;
    c.height = 128;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#6b7280";
    ctx.font = `700 66px ${FONT}`;
    ctx.letterSpacing = "10px";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(tekst.toUpperCase(), 512, 66);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    const w = Math.min(x1 - x0 - 1.2, 5.0);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w / 8), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.set((x0 + x1) / 2, 0.035, z);
    ouder.add(m);
  }

  function boom(ouder, x, z, s = 1) {
    cilinder(ouder, 0.09 * s, 0.9 * s, [x, 0, z], KLEUR.mid, { rand: false });
    const kroon = new THREE.Mesh(new THREE.SphereGeometry(0.75 * s, 18, 14), rond(KLEUR.boom));
    kroon.position.set(x, 1.45 * s, z);
    ouder.add(kroon);
  }

  /* ---------- De borden in de bestuurskamer (D3-schalen, getekend op canvas) ---------- */

  function doek(b, h) {
    const c = document.createElement("canvas");
    c.width = b;
    c.height = h;
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    return { c, ctx: c.getContext("2d"), t, b, h };
  }

  // Scherm: aandeel ziekenhuizen met generatieve AI per jaar. p = 0..1, de staven groeien mee.
  function tekenScherm(d, p) {
    const { ctx, b: W, h: H } = d;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#1a1a1a";
    ctx.font = `700 62px ${FONT}`;
    ctx.fillText("Generatieve AI in ziekenhuizen", 64, 104);
    ctx.fillStyle = "#4b5563";
    ctx.font = `400 38px ${FONT}`;
    ctx.fillText("aandeel van de ziekenhuizen dat het gebruikt", 64, 158);
    const x = d3.scaleBand().domain(GENAI.map((g) => g[0])).range([150, W - 150]).padding(0.34);
    const y = d3.scaleLinear().domain([0, 100]).range([H - 120, 250]);
    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(110, y(0), W - 220, 3);
    GENAI.forEach(([jaar, v], i) => {
      const w = v * p, top = y(w), hoog = y(0) - top;
      ctx.fillStyle = i === GENAI.length - 1 ? "#d4db3e" : "#6b7280";
      if (hoog > 0) {
        ctx.beginPath();
        ctx.roundRect(x(jaar), top, x.bandwidth(), hoog, [10, 10, 0, 0]);
        ctx.fill();
      }
      ctx.fillStyle = "#1a1a1a";
      ctx.textAlign = "center";
      ctx.font = `700 64px ${FONT}`;
      if (p > 0.05) ctx.fillText(`${Math.round(w)}%`, x(jaar) + x.bandwidth() / 2, top - 22);
      ctx.font = `600 42px ${FONT}`;
      ctx.fillText(jaar, x(jaar) + x.bandwidth() / 2, y(0) + 58);
      ctx.textAlign = "left";
    });
    ctx.fillStyle = "#6b7280";
    ctx.font = `400 26px ${FONT}`;
    ctx.textAlign = "right";
    ctx.fillText("AI Monitor Ziekenhuizen 2026, p. 30", W - 48, H - 26);
    ctx.textAlign = "left";
    d.t.needsUpdate = true;
  }

  // Bord: de AI-trechter van een gemiddeld ziekenhuis. "Opgeschaald" krijgt het accent.
  function tekenBord(d, p) {
    const { ctx, b: W, h: H } = d;
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#1a1a1a";
    ctx.font = `700 54px ${FONT}`;
    ctx.fillText("18 AI-toepassingen per ziekenhuis", 52, 92);
    ctx.fillStyle = "#4b5563";
    ctx.font = `400 34px ${FONT}`;
    ctx.fillText("gemiddeld, per fase", 52, 140);
    const y = d3.scaleBand().domain(TRECHTER.map((t) => t[0])).range([190, H - 70]).padding(0.28);
    const x = d3.scaleLinear().domain([0, 8]).range([0, W - 560]);
    const x0 = 470;
    TRECHTER.forEach(([fase, n]) => {
      const acc = fase === "Opgeschaald";
      ctx.fillStyle = "#1a1a1a";
      ctx.font = `${acc ? 700 : 500} 36px ${FONT}`;
      ctx.textAlign = "right";
      ctx.fillText(fase, x0 - 24, y(fase) + y.bandwidth() / 2 + 12);
      ctx.textAlign = "left";
      const w = x(n) * p;
      ctx.fillStyle = acc ? "#d4db3e" : "#6b7280";
      if (w > 0) {
        ctx.beginPath();
        ctx.roundRect(x0, y(fase), w, y.bandwidth(), [0, 8, 8, 0]);
        ctx.fill();
      }
      ctx.fillStyle = "#1a1a1a";
      ctx.font = `700 40px ${FONT}`;
      if (p > 0.05) ctx.fillText(String(n), x0 + w + 16, y(fase) + y.bandwidth() / 2 + 14);
    });
    ctx.fillStyle = "#6b7280";
    ctx.font = `400 24px ${FONT}`;
    ctx.textAlign = "right";
    ctx.fillText("AI Monitor Ziekenhuizen 2026, p. 26", W - 40, H - 22);
    ctx.textAlign = "left";
    d.t.needsUpdate = true;
  }

  // Een bord op een ezel, licht achterover (zo leest de camera het beter).
  function ezel(ouder, d, [w, h], [x, z], kantel = 0.3) {
    const g = new THREE.Group();
    g.position.set(x, 0.02, z);
    ouder.add(g);
    blok(g, [0.08, 1.05, 0.08], [-w / 2 + 0.35, 0, 0], KLEUR.mid, { rand: false });
    blok(g, [0.08, 1.05, 0.08], [w / 2 - 0.35, 0, 0], KLEUR.mid, { rand: false });
    const paneel = new THREE.Group();
    paneel.position.set(0, 1.05 + h / 2, 0);
    paneel.rotation.x = -kantel;
    g.add(paneel);
    blokM(paneel, [w + 0.14, h + 0.14, 0.06], [0, 0, -0.04], KLEUR.inkt, { rand: false });
    paneel.add(new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: d.t })));
    return g;
  }

  /* ---------- De maquette ---------- */

  function bouwMaquette(scene) {
    scene.background = new THREE.Color(KLEUR.papier);
    const hemel = new THREE.HemisphereLight(0xffffff, 0xb8b2a6, 2.4);
    const zon = new THREE.DirectionalLight(0xffffff, 1.6);
    zon.position.set(6, 14, 9);
    scene.add(hemel, zon);

    const W = new THREE.Group();
    scene.add(W);
    const ankers = {};
    const kamers = {};

    // grondplaat, vloeren en de gele randen
    blok(W, [42, 0.3, 30], [0, -0.3, 0.6], KLEUR.lijn);
    for (const [id, k] of Object.entries(KAMERS)) {
      const [x0, x1] = k.x, [z0, z1] = k.z;
      const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
      blok(W, [x1 - x0, 0.02, z1 - z0], [cx, 0, cz], id === "gang" ? KLEUR.creme2 : KLEUR.wit, { rand: false });
      kamers[id] = { midden: new THREE.Vector3(cx, 0, cz), rand: randOp(W, k.x, k.z, id === "gang" ? 0.2 : 0.32) };
      ankers[`kamer-${id}`] = new THREE.Vector3(cx, 2.7, cz);
      // vooraan in de ruimte, net buiten de schaduw van de muur (de camera kijkt schuin over de muur)
      if (NAMEN[id]) vloerNaam(W, NAMEN[id], k.x, z1 - 1.45);
    }
    ankers["kamer-gang"].set(-4, 1.7, 0);

    // muren: buitenmuren, gangmuren met een deur per ruimte, tussenmuren
    const deur = (id) => [KAMERS[id].x[0] + 1.3, 1.3];
    muur(W, -16, -10, 16, -10);
    muur(W, -16, 10, 16, 10, [[-12, 2.4]]);
    muur(W, -16, -10, -16, 10);
    muur(W, 16, -10, 16, 10);
    muur(W, -16, -GANG, 16, -GANG, ["bestuur", "regie", "radiologie", "lab"].map(deur));
    muur(W, -16, GANG, 16, GANG, [[-12, 3.2], ...["poli", "admin", "kwaliteit"].map(deur)]);
    for (const x of [-7, -1, 8]) muur(W, x, -10, x, -GANG);
    for (const x of [-8, -1, 7]) muur(W, x, GANG, x, 10);

    // bomen rond het gebouw
    [[-18.5, -7], [-18.5, -1], [-18.5, 5], [18.5, -6], [18.5, 1], [18.5, 7], [-7, 12.8], [-3, 13.2], [2, 12.6], [7, 13.1], [12, 12.7],
      [-14, -12.3], [-8, -12.6], [-2, -12.2], [4, -12.6], [10, -12.3], [15, -12.6]].forEach(([x, z], i) => boom(W, x, z, 0.85 + (i % 3) * 0.12));

    /* Bestuurskamer: het MT vergadert. Op het scherm de groei van generatieve AI, op het bord de trechter. */
    tafel(W, [5.0, 1.8], [-11.6, -5.0]);
    [[-13.4, -6.25, 0], [-11.6, -6.25, 0], [-9.8, -6.25, 0], [-13.4, -3.75, Math.PI], [-11.6, -3.75, Math.PI], [-9.8, -3.75, Math.PI], [-14.75, -5.0, Math.PI / 2]]
      .forEach(([x, z, rot], i) => {
        stoel(W, x, z, rot);
        poppetje(W, { x, z, rot, zit: true, armen: 1.15, jas: i % 2 ? KLEUR.donker : KLEUR.mid, broek: KLEUR.donker });
      });
    const scherm = doek(1280, 720), bord = doek(1100, 760);
    tekenScherm(scherm, 1);
    tekenBord(bord, 1);
    ezel(W, scherm, [4.0, 2.25], [-13.2, -8.9]);
    ezel(W, bord, [2.75, 1.9], [-9.1, -8.9]);
    poppetje(W, { x: -11.05, z: -8.1, rot: 0.25, jas: KLEUR.donker, broek: KLEUR.donker });
    ankers.scherm = new THREE.Vector3(-13.2, 3.9, -9.2);
    ankers.bord = new THREE.Vector3(-9.1, 3.6, -9.2);

    /* AI-regiegroep: ronde tafel, vier rollen en één lege stoel vooraan */
    const rc = { x: -4.0, z: -5.6 };
    cilinder(W, 0.22, 0.7, [rc.x, 0.02, rc.z], KLEUR.lijn, { rand: false });
    cilinder(W, 1.05, 0.06, [rc.x, 0.7, rc.z]);
    for (let i = 0; i < 5; i++) {
      const a = (i * 2 * Math.PI) / 5;
      const x = rc.x + 1.7 * Math.sin(a), z = rc.z + 1.7 * Math.cos(a);
      const rot = Math.atan2(rc.x - x, rc.z - z);
      stoel(W, x, z, rot);
      if (i > 0) poppetje(W, { x, z, rot, zit: true, armen: 1.1, jas: i === 1 || i === 3 ? KLEUR.wit : KLEUR.mid, broek: KLEUR.donker });
      ankers[`regie${i}`] = new THREE.Vector3(x, i ? 1.75 : 1.0, z);
    }

    /* Radiologie: CT-scanner, glaswand, console met de radioloog, AI-kastje, bak met uitslagen */
    blok(W, [0.9, 0.45, 2.0], [4.6, 0.02, -6.2], KLEUR.lijn);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.38, 20, 56), rond(KLEUR.wit));
    ring.rotation.y = Math.PI / 2;
    ring.position.set(4.6, 1.38, -6.2);
    W.add(ring);
    blok(W, [2.6, 0.82, 0.45], [6.3, 0.02, -6.2], KLEUR.lijn, { rand: false });
    blok(W, [3.4, 0.1, 0.7], [5.9, 0.84, -6.2]);
    liggend(W, [6.62, 1.1, -6.2], { jas: KLEUR.grijs, broek: KLEUR.grijs });
    const glas = new THREE.MeshBasicMaterial({ color: 0xdfe7ea, transparent: true, opacity: 0.35, depthWrite: false });
    blok(W, [0.06, 1.1, 6.2], [2.4, 0.02, -6.9], KLEUR.wit, { materiaal: glas });
    blok(W, [0.9, 0.75, 2.4], [1.1, 0.02, -7.4]);
    blok(W, [0.06, 0.45, 0.7], [1.42, 0.77, -7.95], KLEUR.donker);
    blok(W, [0.06, 0.45, 0.7], [1.42, 0.77, -6.95], KLEUR.donker);
    stoel(W, 0.2, -7.4, Math.PI / 2);
    poppetje(W, { x: 0.2, z: -7.4, rot: Math.PI / 2, zit: true, armen: 1.05, jas: KLEUR.wit, broek: KLEUR.grijs });
    blok(W, [0.7, 0.75, 0.6], [1.3, 0.02, -4.9], KLEUR.lijn);
    aiKastje(W, [0.62, 0.44, 0.5], [1.3, 0.77, -4.9]);
    blok(W, [1.9, 0.75, 0.7], [-0.25, 0.02, -3.0]);
    ankers.ct = new THREE.Vector3(4.6, 2.85, -6.2);
    ankers.aiRadio = new THREE.Vector3(1.3, 1.5, -4.9);
    ankers.radioloog = new THREE.Vector3(0.2, 1.75, -7.4);
    const scans = Array.from({ length: 5 }, () => vel(W, [0.46, 0.04, 0.38]));

    /* Onderzoek: twee labtafels met microscopen en kolven, twee onderzoekers */
    for (const z of [-7.8, -4.6]) blok(W, [6.2, 0.9, 0.8], [12.3, 0.02, z]);
    [[10.2, -7.9], [12.0, -7.7], [14.1, -4.7], [11.0, -4.5]].forEach(([x, z]) => {
      blok(W, [0.26, 0.08, 0.26], [x, 0.92, z], KLEUR.grijs);
      cilinder(W, 0.06, 0.42, [x, 1.0, z - 0.04], KLEUR.donker, { rand: false });
    });

function zetCamera(c) {
  const w = doek.clientWidth || 1, h = doek.clientHeight || 1, a = w / h, r = 90;
  camera.left = -HALF * a;
  camera.right = HALF * a;
  camera.top = HALF;
  camera.bottom = -HALF;
  camera.zoom = c.zoom;
  camera.position.set(c.tx + r * Math.sin(c.az) * Math.cos(c.el), c.ty + r * Math.sin(c.el), c.tz + r * Math.cos(c.az) * Math.cos(c.el));
  camera.lookAt(c.tx, c.ty, c.tz);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(); // project() leest de wereldmatrix; anders loopt die een beeld achter
}

// Zoom waarbij het hele gebouw in beeld past, met ruimte boven voor de labels. De bomen mogen wegvallen.

function pasZoom(c) {
  zetCamera({ ...c, zoom: 1 });
  let mx = 0, my = 0;
  const v = new THREE.Vector3();
  for (const p of HOEKEN) {
    v.copy(p).project(camera);
    mx = Math.max(mx, Math.abs(v.x));
    my = Math.max(my, Math.abs(v.y));
  }
  return 0.97 / Math.max(mx, my);
}

// Liggende staven met het getal erachter; één reeks, dus geen legenda. accent = index met het geel.
// Zonder D3 staan dezelfde cijfers er als lijst.
function staafPad(w, h) {
  if (w <= 0) return "";
  const r = Math.min(4, w);
  return `M0,0H${w - r}Q${w},0 ${w},${r}V${h - r}Q${w},${h} ${w - r},${h}H0Z`;
}
function staven(houder, data, { accent = -1, max = 100 } = {}) {
  if (!d3) {
    houder.innerHTML = `<ul class="als-tekst">${data.map(([n, w]) => `<li>${n}: <b>${w}%</b></li>`).join("")}</ul>`;
    return { accent() {} };
  }
  const RIJ = 38, BREED = 540, L = 228, R = 58, H = 20;
  const x = d3.scaleLinear().domain([0, max]).range([0, BREED - L - R]);
  const svg = d3.select(houder).append("svg")
    .attr("class", "staven").attr("viewBox", `0 0 ${BREED} ${data.length * RIJ}`)
    .attr("role", "img").attr("aria-label", data.map(([n, w]) => `${n}: ${w}%`).join(", "));
  const rij = svg.selectAll("g").data(data).join("g")
    .attr("transform", (_, i) => `translate(0,${i * RIJ})`)
    .classed("acc", (_, i) => i === accent);
  rij.append("text").attr("class", "naam").attr("x", L - 12).attr("y", RIJ / 2 + 6).attr("text-anchor", "end").text((d) => d[0]);
  rij.append("path").attr("class", "staaf").attr("transform", `translate(${L},${(RIJ - H) / 2})`)
    .transition().duration(T(0.8) * 1000).delay((_, i) => T(0.3 + i * 0.08) * 1000)
    .attrTween("d", (d) => (t) => staafPad(x(d[1]) * t, H));
  rij.append("text").attr("class", "waarde").attr("x", (d) => L + x(d[1]) + 9).attr("y", RIJ / 2 + 6).text((d) => `${d[1]}%`)
    .attr("opacity", 0).transition().duration(T(0.3) * 1000).delay((_, i) => T(0.9 + i * 0.08) * 1000).attr("opacity", 1);
  return { accent: (i) => rij.classed("acc", (_, j) => j === i) };
}

  if (s.bron) h += `<p class="bron">Bron: AI Monitor Ziekenhuizen 2026, ${s.bron}</p>`;
  el.innerHTML = h;
  grafiek = s.grafiek ? GRAFIEK[s.grafiek]() : null;
  animate([...el.children], { opacity: [0, 1] }, { duration: T(0.45), delay: stagger(T(0.07)) });
}

/* ================= Wat er per stap gebeurt ================= */

let versie = 0, lopend = [];
const speel = (a) => (lopend.push(a), a);

// De gele rand rond een ruimte; ook het label van die ruimte licht op.
function randen(aan) {
  for (const [id, k] of Object.entries(maq.kamers)) {
    const doel = aan.includes(id) ? 1 : 0;
    if (reduce) k.rand.opacity = doel;
    else speel(animate(k.rand, { opacity: doel }, { duration: 0.45 }));
  }
  for (const l of labels) if (l.soort === "kamer") l.el.classList.toggle("aan", aan.includes(l.id));
}
// Rondgang: één proces tegelijk (of alle, zonder beweging).
function licht(i) {
  randen(i < 0 ? PROCESSEN.map((p) => p[2]) : [PROCESSEN[i][2]]);
  grafiek?.accent(i);
}

const RADIO = { bron: [3.6, 1.2, -6.2], ai: [1.3, 1.45, -4.9], bak: (i) => [-1.0 + i * 0.4, 0.8, -3.0], bureau: (i) => [0.82, 0.8, -8.25 + i * 0.4] };
const KW = { stapel: [9.35, 1.0, 5.25], ai: [10.8, 1.25, 5.2], bak: (i) => [12.78 + i * 0.42, 0.79, 5.1], adviseur: [10.05, 0.79, 5.15] };
const kwPlek = (i) => (i === GEKOZEN ? KW.adviseur : KW.bak(i));

// De stand aan het begin van stap n: alles wat eerdere stappen hebben verplaatst, staat al op zijn plek.
function zetBegin(n) {
  maq.scans.forEach((s, i) => {
    s.g.visible = n > STAP_SCANS;
    s.markeer(n > STAP_SCANS && i === GEKOZEN);
    s.g.position.set(...(n > STAP_RADIOLOOG ? RADIO.bureau(i) : RADIO.bak(i)));
  });
  maq.vims.forEach((s, i) => {
    s.g.visible = n > STAP_VIM;
    s.markeer(n > STAP_VIM && i === GEKOZEN);
    s.g.position.set(...kwPlek(i));
  });
  maq.aiKw.visible = n > STAP_VIM;
  maq.aiKw.scale.setScalar(1);
  maq.scherm(1);
  maq.bord(1);
}

// Een vel van A via de AI naar B. Bij de AI kleurt het gekozen vel zwart met geel.
function viaAI(items, van, ai, naar, v) {
  items.forEach((it, i) => {
    it.g.visible = true;
    it.markeer(false);
    it.g.position.set(...van);
    if (reduce) {
      it.g.position.set(...naar(i));
      it.markeer(i === GEKOZEN);
      return;
    }
    const heen = speel(animate(it.g.position, { x: [van[0], ai[0]], y: [van[1], ai[1] + 0.5, ai[1]], z: [van[2], ai[2]] },
      { duration: 0.9, delay: 0.5 + i * 0.55, ease: "easeInOut" }));
    heen.then(() => {
      if (v !== versie) return;
      if (i === GEKOZEN) it.markeer(true);
      const p = naar(i);
      speel(animate(it.g.position, { x: [ai[0], p[0]], y: [ai[1], p[1] + 0.45, p[1]], z: [ai[2], p[2]] }, { duration: 0.8, delay: 0.15, ease: "easeInOut" }));
    });
  });
}

const ACTIE = {
  scherm() {
    const st = { p: 0 };
    maq.scherm(reduce ? 1 : 0);
    if (!reduce) speel(animate(st, { p: 1 }, { duration: 1.8, delay: 0.9, ease: "easeOut", onUpdate: () => maq.scherm(st.p) }));
  },
  bord() {
    const st = { p: 0 };
    maq.bord(reduce ? 1 : 0);
    if (!reduce) speel(animate(st, { p: 1 }, { duration: 1.5, delay: 0.9, ease: "easeOut", onUpdate: () => maq.bord(st.p) }));
  },
  scans(v) {
    viaAI(maq.scans, RADIO.bron, RADIO.ai, RADIO.bak, v);
  },
  radioloog() {
    maq.scans.forEach((s, i) => {
      if (reduce) s.g.position.set(...RADIO.bureau(i));
      else speel(animate(s.g.position, { x: RADIO.bureau(i)[0], y: [s.g.position.y, 1.3, RADIO.bureau(i)[1]], z: RADIO.bureau(i)[2] }, { duration: 1.0, delay: 1.0 + i * 0.25, ease: "easeInOut" }));
    });
  },
  vim(v) {
    maq.aiKw.visible = true;
    maq.aiKw.scale.setScalar(reduce ? 1 : 0.01);
    if (!reduce) speel(animate(maq.aiKw.scale, { x: 1, y: 1, z: 1 }, { duration: 0.6, delay: 1.0, type: "spring", bounce: 0.3 }));
    viaAI(maq.vims, KW.stapel, KW.ai, kwPlek, v);
  },
};

/* ================= Stappen ================= */

function ga(n) {
  n = Math.max(0, Math.min(STAPPEN.length - 1, n));
  if (n === stap) return;
  stap = n;
  versie++;
  lopend.forEach((a) => a.stop());
  lopend = [];
  stapStart = performance.now();
  rondI = null;
  const s = STAPPEN[n];

  $("teller").textContent = `${n + 1} / ${STAPPEN.length}`;
  $("balk").style.width = `${((n + 1) / STAPPEN.length) * 100}%`;
  history.replaceState(null, "", `#stap-${n + 1}`);

  // de hele plaat: doek over de volle breedte, uitleg als onderschrift
  $("maquette").classList.toggle("plaat", Boolean(s.plaat));
  maat();
  uitlegTekenen(s);
  if (!maq) return; // zonder maquette alleen de tekst

  // camera
  const doel = { ...s.cam };
  if (doel.zoom === "pas") doel.zoom = pasZoom(doel);
  if (reduce) Object.assign(cam, doel);
  else speel(animate(cam, doel, { duration: 1.6, ease: [0.45, 0, 0.2, 1] }));

  // dag of nacht
  const nacht = s.nacht ? 1 : 0;
  if (reduce) toestand.nacht = nacht;
  else speel(animate(toestand, { nacht }, { duration: 1.2, delay: s.nacht ? 0.8 : 0 }));

  // labels
  const roep = new Set(s.roep || []);
  for (const l of labels) {
    const zien = l.soort === "kamer" ? Boolean(s.kamers) : roep.has(l.id);
    const was = !l.el.classList.contains("weg");
    l.el.classList.toggle("weg", !zien);
    if (zien && !was) animate(l.el, { opacity: [0, 1] }, { duration: T(0.4), delay: T(l.soort === "kamer" ? 0.6 : 1.2) });
  }

  randen(s.focus || []);
  if (s.rondgang && reduce) licht(-1);

  zetBegin(n);
  ACTIE[s.actie]?.(versie);
}

addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const volgende = ["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"];
  const vorige = ["ArrowLeft", "ArrowUp", "PageUp", "Backspace"];
  if (volgende.includes(e.key)) { e.preventDefault(); ga(stap + 1); }
  else if (vorige.includes(e.key)) { e.preventDefault(); ga(stap - 1); }
  else if (e.key === "Home") ga(0);
  else if (e.key === "End") ga(STAPPEN.length - 1);
});
$("verder").addEventListener("click", () => ga(stap + 1));
$("terug").addEventListener("click", () => ga(stap - 1));

const stapUitHash = () => {
  const n = parseInt((location.hash.match(/stap-(\d+)/) || [])[1], 10);
  return Number.isFinite(n) ? n - 1 : 0;
};
addEventListener("hashchange", () => ga(stapUitHash()));

const eerste = STAPPEN[stapUitHash()] || STAPPEN[0];
$("maquette").classList.toggle("plaat", Boolean(eerste.plaat));
maat();
if (maq) Object.assign(cam, { ...eerste.cam, zoom: eerste.cam.zoom === "pas" ? pasZoom(eerste.cam) : eerste.cam.zoom });
ga(stapUitHash());
if (maq) requestAnimationFrame(teken);
</script>
</body>
